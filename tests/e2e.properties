# ──────────────────────────────────────────────────────────────────────────────
# Task Manager E2E configuration
#
# These credentials are used by the browser tests. They are NOT mocks: the
# tests log in against the real backend that is already running.
#
# The main user must have the ADMIN role for the admin-panel tests.
# The collaborator is the real "basic/basic" user seeded by the backend when
# taskmanager.create-basic-user=true (the default in application.properties).
# ──────────────────────────────────────────────────────────────────────────────

e2e.base-url=http://localhost:3000

e2e.username=admin
e2e.password=admin

e2e.collaborator.username=basic
e2e.collaborator.password=basic
e2e.collaborator.email=basic@example.com

e2e.browser=chromium
# true = no browser window (headless); false = visible Chromium window
e2e.headless=false
e2e.timeout-seconds=30
e2e.assertion-timeout-seconds=15
e2e.slow-mo-ms=0
e2e.artifacts-dir=target/playwright-artifacts

# Set to true to record a Playwright trace for every test (larger output).
e2e.trace=false
